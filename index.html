<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolsKart - Free Online Tools</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #0a0a0f;
        --card: #13131a;
        --card2: #1a1a24;
        --border: #2a2a3a;
        --accent: #7c6aff;
        --accent2: #ff6a9b;
        --text: #f0f0ff;
        --muted: #888899;
        --green: #4ade80;
        --yellow: #fbbf24;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 2rem;
        border-bottom: 1px solid var(--border);
        background: rgba(10, 10, 15, 0.95);
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(10px);
      }
      .logo {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: 1.4rem;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .nav-links {
        display: flex;
        gap: 1.5rem;
      }
      .nav-links a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.9rem;
        cursor: pointer;
        transition: color 0.2s;
      }
      .nav-links a:hover {
        color: var(--text);
      }
      .hero {
        text-align: center;
        padding: 4rem 2rem 2rem;
        position: relative;
      }
      .hero h1 {
        font-family: "Syne", sans-serif;
        font-size: 3rem;
        font-weight: 800;
        line-height: 1.1;
        margin-bottom: 1rem;
      }
      .hero h1 span {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .hero p {
        color: var(--muted);
        font-size: 1.1rem;
        max-width: 500px;
        margin: 0 auto 2rem;
      }
      .search-bar {
        display: flex;
        max-width: 500px;
        margin: 0 auto 1rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        transition: border-color 0.2s;
      }
      .search-bar:focus-within {
        border-color: var(--accent);
      }
      .search-bar input {
        flex: 1;
        padding: 0.9rem 1.2rem;
        background: none;
        border: none;
        outline: none;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 1rem;
      }
      .search-bar input::placeholder {
        color: var(--muted);
      }
      .search-bar button {
        padding: 0.9rem 1.4rem;
        background: var(--accent);
        border: none;
        color: white;
        cursor: pointer;
        font-size: 1rem;
        transition: opacity 0.2s;
      }
      .search-bar button:hover {
        opacity: 0.85;
      }
      .stats {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin: 1.5rem 0;
        flex-wrap: wrap;
      }
      .stat {
        text-align: center;
      }
      .stat-num {
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
        color: var(--accent);
      }
      .stat-label {
        color: var(--muted);
        font-size: 0.8rem;
      }
      .cats {
        display: flex;
        gap: 0.6rem;
        justify-content: center;
        flex-wrap: wrap;
        padding: 1rem 2rem;
      }
      .cat-btn {
        padding: 0.4rem 1rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.85rem;
        font-family: "DM Sans", sans-serif;
        transition: all 0.2s;
      }
      .cat-btn:hover,
      .cat-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      .tools-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 1rem;
        padding: 1rem 2rem 2rem;
        max-width: 1100px;
        margin: 0 auto;
      }
      .tool-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.4rem;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      .tool-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        background: var(--card2);
      }
      .tool-icon {
        font-size: 2rem;
        width: 52px;
        height: 52px;
        background: var(--card2);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tool-name {
        font-family: "Syne", sans-serif;
        font-weight: 600;
        font-size: 1rem;
      }
      .tool-desc {
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.5;
      }
      .tool-tag {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 6px;
        font-size: 0.75rem;
        background: rgba(124, 106, 255, 0.15);
        color: var(--accent);
      }
      .tool-area {
        display: none;
        padding: 1rem 2rem 2rem;
        max-width: 900px;
        margin: 0 auto;
      }
      .tool-area.active {
        display: block;
      }
      .tool-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      .back-btn {
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.5rem 1rem;
        border-radius: 8px;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        font-size: 0.9rem;
        transition: all 0.2s;
      }
      .back-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .tool-header h2 {
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
      }
      .tool-box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1.5rem;
      }
      textarea,
      input[type="text"] {
        width: 100%;
        background: var(--card2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1rem;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 0.95rem;
        outline: none;
        resize: vertical;
        transition: border-color 0.2s;
      }
      textarea:focus,
      input[type="text"]:focus {
        border-color: var(--accent);
      }
      .btn {
        padding: 0.7rem 1.4rem;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        font-weight: 500;
        font-size: 0.9rem;
        transition: all 0.2s;
      }
      .btn-primary {
        background: var(--accent);
        color: white;
      }
      .btn-primary:hover {
        opacity: 0.85;
      }
      .btn-secondary {
        background: var(--card2);
        border: 1px solid var(--border);
        color: var(--text);
      }
      .btn-secondary:hover {
        border-color: var(--accent);
      }
      .btn-row {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      .result-box {
        background: var(--card2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1rem;
        margin-top: 1rem;
        min-height: 60px;
        font-size: 0.95rem;
        line-height: 1.6;
        word-break: break-all;
      }
      .stats-row {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-top: 1rem;
      }
      .stat-box {
        background: var(--card2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 1rem;
        flex: 1;
        min-width: 80px;
        text-align: center;
      }
      .stat-box .num {
        font-family: "Syne", sans-serif;
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--accent);
      }
      .stat-box .lbl {
        color: var(--muted);
        font-size: 0.75rem;
        margin-top: 0.2rem;
      }
      .color-preview {
        width: 100%;
        height: 100px;
        border-radius: 10px;
        margin-top: 1rem;
        border: 1px solid var(--border);
      }
      .password-out {
        font-family: monospace;
        font-size: 1.1rem;
        letter-spacing: 1px;
        word-break: break-all;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
        margin: 0.5rem 0;
      }
      input[type="color"] {
        width: 60px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: none;
        cursor: pointer;
        padding: 2px;
      }
      .flex {
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }
      label {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .adsense-placeholder {
        background: linear-gradient(
          135deg,
          rgba(124, 106, 255, 0.05),
          rgba(255, 106, 155, 0.05)
        );
        border: 1px dashed var(--border);
        border-radius: 10px;
        padding: 1.5rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
        margin: 1rem 0;
      }
      .adsense-placeholder strong {
        display: block;
        color: var(--accent);
        margin-bottom: 0.3rem;
      }

      /* ===== ADSENSE REAL CODE YAHAN LAGAO ===== */

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
*/
    </style>
  </head>
  <body>
    <nav class="nav">
      <div class="logo">ToolsKart</div>
      <div class="nav-links">
        <a onclick="showHome()">Home</a>
        <a href="/privacy-policy.html">Privacy Policy</a>
        <a href="/contact.html">Contact</a>
      </div>
    </nav>

    <div id="home-view">
      <div class="hero">
        <h1>Free Online Tools<br /><span>Sab Kuch Ek Jagah</span></h1>
        <p>
          Word counter, password generator, color picker aur bahut kuch — bilkul
          free!
        </p>
        <div class="search-bar">
          <input
            type="text"
            placeholder="Tool dhundho... (e.g. word counter)"
            id="search-input"
            oninput="filterTools()"
          />
          <button>&#128269;</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-num">8+</div>
          <div class="stat-label">Free Tools</div>
        </div>
        <div class="stat">
          <div class="stat-num">0</div>
          <div class="stat-label">Login Required</div>
        </div>
        <div class="stat">
          <div class="stat-num">100%</div>
          <div class="stat-label">Free Forever</div>
        </div>
      </div>

      <!-- ADSENSE AD YAHAN LAGAO (approve hone ke baad) -->
      <div
        class="adsense-placeholder"
        style="max-width: 728px; margin: 0.5rem auto 0"
      >
        <strong>Ad Space — Google AdSense</strong>
        Yahan apna AdSense code paste karo approve hone ke baad!
      </div>

      <div class="cats">
        <button class="cat-btn active" onclick="filterCat('all', this)">
          Sab
        </button>
        <button class="cat-btn" onclick="filterCat('text', this)">Text</button>
        <button class="cat-btn" onclick="filterCat('security', this)">
          Security
        </button>
        <button class="cat-btn" onclick="filterCat('color', this)">
          Color
        </button>
        <button class="cat-btn" onclick="filterCat('math', this)">Math</button>
      </div>

      <div class="tools-grid" id="tools-grid"></div>
    </div>

    <div id="tool-view"></div>

    <script>
      const tools = [
        {
          id: "word",
          icon: "📝",
          name: "Word Counter",
          desc: "Text mein words, characters, aur sentences count karo instantly.",
          tag: "text",
          cat: "text",
        },
        {
          id: "password",
          icon: "🔐",
          name: "Password Generator",
          desc: "Strong aur secure password banao apni choice ke saath.",
          tag: "security",
          cat: "security",
        },
        {
          id: "color",
          icon: "🎨",
          name: "Color Picker",
          desc: "HEX, RGB aur HSL values ek click mein pao.",
          tag: "color",
          cat: "color",
        },
        {
          id: "case",
          icon: "🔤",
          name: "Text Case Converter",
          desc: "UPPERCASE, lowercase, Title Case ek click mein badlo.",
          tag: "text",
          cat: "text",
        },
        {
          id: "lorem",
          icon: "📄",
          name: "Lorem Ipsum Generator",
          desc: "Fake placeholder text generate karo designs ke liye.",
          tag: "text",
          cat: "text",
        },
        {
          id: "bmi",
          icon: "⚖️",
          name: "BMI Calculator",
          desc: "Apna Body Mass Index calculate karo height aur weight se.",
          tag: "math",
          cat: "math",
        },
        {
          id: "age",
          icon: "🎂",
          name: "Age Calculator",
          desc: "Date of birth se exact age calculate karo.",
          tag: "math",
          cat: "math",
        },
        {
          id: "encode",
          icon: "🔒",
          name: "Base64 Encoder",
          desc: "Text ko Base64 mein encode ya decode karo.",
          tag: "security",
          cat: "security",
        },
      ];

      let currentCat = "all";

      function renderTools(list) {
        const g = document.getElementById("tools-grid");
        g.innerHTML = list
          .map(
            (t) => `
    <div class="tool-card" onclick="openTool('${t.id}')">
      <div class="tool-icon">${t.icon}</div>
      <div>
        <div class="tool-name">${t.name}</div>
        <div class="tool-desc">${t.desc}</div>
      </div>
      <div class="tool-tag">${t.tag}</div>
    </div>
  `,
          )
          .join("");
      }

      function filterCat(cat, btn) {
        currentCat = cat;
        document
          .querySelectorAll(".cat-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const q = document.getElementById("search-input").value.toLowerCase();
        const filtered = tools.filter(
          (t) =>
            (cat === "all" || t.cat === cat) &&
            (t.name.toLowerCase().includes(q) ||
              t.desc.toLowerCase().includes(q)),
        );
        renderTools(filtered);
      }

      function filterTools() {
        const q = document.getElementById("search-input").value.toLowerCase();
        const filtered = tools.filter(
          (t) =>
            (currentCat === "all" || t.cat === currentCat) &&
            (t.name.toLowerCase().includes(q) ||
              t.desc.toLowerCase().includes(q)),
        );
        renderTools(filtered);
      }

      renderTools(tools);

      function showHome() {
        document.getElementById("home-view").style.display = "";
        document.getElementById("tool-view").style.display = "none";
      }

      function openTool(id) {
        document.getElementById("home-view").style.display = "none";
        const v = document.getElementById("tool-view");
        v.style.display = "";
        v.innerHTML = getToolHTML(id);
      }

      function getToolHTML(id) {
        const t = tools.find((x) => x.id === id);
        const back = `<div class="tool-area active"><div class="tool-header"><button class="back-btn" onclick="showHome()">&#8592; Back</button><h2>${t.icon} ${t.name}</h2></div>`;
        const ad = `<div class="adsense-placeholder"><strong>Ad Space — Google AdSense</strong>Yahan apna AdSense code paste karo</div>`;

        if (id === "word")
          return (
            back +
            `
    <div class="tool-box">
      <textarea id="wc-text" rows="8" placeholder="Yahan apna text likho..." oninput="wcCount()"></textarea>
      <div class="stats-row">
        <div class="stat-box"><div class="num" id="wc-w">0</div><div class="lbl">Words</div></div>
        <div class="stat-box"><div class="num" id="wc-c">0</div><div class="lbl">Characters</div></div>
        <div class="stat-box"><div class="num" id="wc-s">0</div><div class="lbl">Sentences</div></div>
        <div class="stat-box"><div class="num" id="wc-p">0</div><div class="lbl">Paragraphs</div></div>
      </div>
      <div class="btn-row"><button class="btn btn-secondary" onclick="document.getElementById('wc-text').value='';wcCount()">Clear</button></div>
    </div>${ad}</div>`
          );

        if (id === "password")
          return (
            back +
            `
    <div class="tool-box">
      <div class="flex"><label>Length: <strong id="pl-val">16</strong></label><input type="range" min="6" max="64" value="16" id="pl" oninput="document.getElementById('pl-val').textContent=this.value;genPass()"></div>
      <div class="flex" style="margin-top:1rem">
        <label><input type="checkbox" id="pu" checked onchange="genPass()"> Uppercase</label>
        <label><input type="checkbox" id="pd" checked onchange="genPass()"> Numbers</label>
        <label><input type="checkbox" id="ps" checked onchange="genPass()"> Symbols</label>
      </div>
      <div class="result-box password-out" id="pass-out" style="margin-top:1rem;font-size:1.1rem"></div>
      <div id="pass-strength" style="margin-top:0.8rem"></div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="genPass()">Generate</button>
        <button class="btn btn-secondary" onclick="copyText('pass-out')">Copy</button>
      </div>
    </div>${ad}</div>`
          );

        if (id === "color")
          return (
            back +
            `
    <div class="tool-box">
      <div class="flex"><label>Color choose karo:</label><input type="color" id="cp" value="#7c6aff" oninput="updateColor()"></div>
      <div id="color-prev" class="color-preview" style="background:#7c6aff"></div>
      <div class="stats-row" style="margin-top:1rem">
        <div class="stat-box"><div class="num" id="hex-val" style="font-size:1rem">#7C6AFF</div><div class="lbl">HEX</div></div>
        <div class="stat-box"><div class="num" id="rgb-val" style="font-size:0.85rem">124,106,255</div><div class="lbl">RGB</div></div>
      </div>
      <div class="btn-row"><button class="btn btn-secondary" onclick="copyText('hex-val')">HEX Copy</button><button class="btn btn-secondary" onclick="copyText('rgb-val')">RGB Copy</button></div>
    </div>${ad}</div>`
          );

        if (id === "case")
          return (
            back +
            `
    <div class="tool-box">
      <textarea id="cc-in" rows="6" placeholder="Yahan text likho..."></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="convertCase('upper')">UPPERCASE</button>
        <button class="btn btn-secondary" onclick="convertCase('lower')">lowercase</button>
        <button class="btn btn-secondary" onclick="convertCase('title')">Title Case</button>
        <button class="btn btn-secondary" onclick="convertCase('sentence')">Sentence case</button>
      </div>
      <div class="result-box" id="cc-out" style="min-height:80px"></div>
      <div class="btn-row"><button class="btn btn-secondary" onclick="copyText('cc-out')">Copy Result</button></div>
    </div>${ad}</div>`
          );

        if (id === "lorem")
          return (
            back +
            `
    <div class="tool-box">
      <div class="flex"><label>Paragraphs:</label><input type="range" min="1" max="10" value="3" id="lp" oninput="document.getElementById('lp-val').textContent=this.value;genLorem()"><span id="lp-val">3</span></div>
      <div class="result-box" id="lorem-out" style="min-height:120px;line-height:1.7;margin-top:1rem"></div>
      <div class="btn-row"><button class="btn btn-primary" onclick="genLorem()">Generate</button><button class="btn btn-secondary" onclick="copyText('lorem-out')">Copy</button></div>
    </div>${ad}</div>`
          );

        if (id === "bmi")
          return (
            back +
            `
    <div class="tool-box">
      <div class="flex"><label>Height (cm):</label><input type="text" id="bh" placeholder="e.g. 170" style="width:140px"></div>
      <div class="flex" style="margin-top:0.8rem"><label>Weight (kg):</label><input type="text" id="bw" placeholder="e.g. 65" style="width:140px"></div>
      <div class="btn-row"><button class="btn btn-primary" onclick="calcBMI()">Calculate</button></div>
      <div class="result-box" id="bmi-out"></div>
    </div>${ad}</div>`
          );

        if (id === "age")
          return (
            back +
            `
    <div class="tool-box">
      <label>Date of Birth:</label><br><br>
      <input type="text" id="dob" placeholder="DD/MM/YYYY — e.g. 15/08/2003" style="max-width:300px">
      <div class="btn-row"><button class="btn btn-primary" onclick="calcAge()">Calculate Age</button></div>
      <div class="result-box" id="age-out"></div>
    </div>${ad}</div>`
          );

        if (id === "encode")
          return (
            back +
            `
    <div class="tool-box">
      <textarea id="enc-in" rows="5" placeholder="Text yahan likho..."></textarea>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="b64('encode')">Encode (Base64)</button>
        <button class="btn btn-secondary" onclick="b64('decode')">Decode</button>
      </div>
      <div class="result-box" id="enc-out"></div>
      <div class="btn-row"><button class="btn btn-secondary" onclick="copyText('enc-out')">Copy</button></div>
    </div>${ad}</div>`
          );

        return back + `<div class="tool-box"><p>Coming soon!</p></div></div>`;
      }

      function wcCount() {
        const t = document.getElementById("wc-text").value;
        document.getElementById("wc-w").textContent = t.trim()
          ? t.trim().split(/\s+/).length
          : 0;
        document.getElementById("wc-c").textContent = t.length;
        document.getElementById("wc-s").textContent = t
          ? t.split(/[.!?]+/).filter((s) => s.trim()).length
          : 0;
        document.getElementById("wc-p").textContent = t
          ? t.split(/\n\s*\n/).filter(Boolean).length
          : 0;
      }

      function genPass() {
        const len = parseInt(document.getElementById("pl").value);
        let chars = "abcdefghijklmnopqrstuvwxyz";
        if (document.getElementById("pu").checked)
          chars += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        if (document.getElementById("pd").checked) chars += "0123456789";
        if (document.getElementById("ps").checked)
          chars += "!@#$%^&*()_+-=[]{}";
        let p = "";
        for (let i = 0; i < len; i++)
          p += chars[Math.floor(Math.random() * chars.length)];
        document.getElementById("pass-out").textContent = p;
        const score =
          len < 8
            ? 1
            : len < 12
              ? 2
              : document.getElementById("ps").checked
                ? 4
                : 3;
        const labels = ["", "Weak", "Fair", "Good", "Strong"];
        const colors = ["", "#ef4444", "#f59e0b", "#3b82f6", "#4ade80"];
        document.getElementById("pass-strength").innerHTML =
          `<span style="color:${colors[score]};font-weight:500">${labels[score]} Password</span>`;
      }

      function updateColor() {
        const v = document.getElementById("cp").value;
        document.getElementById("color-prev").style.background = v;
        document.getElementById("hex-val").textContent = v.toUpperCase();
        const r = parseInt(v.slice(1, 3), 16),
          g = parseInt(v.slice(3, 5), 16),
          b = parseInt(v.slice(5, 7), 16);
        document.getElementById("rgb-val").textContent = `${r},${g},${b}`;
      }

      function convertCase(type) {
        const t = document.getElementById("cc-in").value;
        let r = "";
        if (type === "upper") r = t.toUpperCase();
        else if (type === "lower") r = t.toLowerCase();
        else if (type === "title")
          r = t.replace(
            /\w\S*/g,
            (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(),
          );
        else r = t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
        document.getElementById("cc-out").textContent = r;
      }

      const loremBase =
        "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia.";
      function genLorem() {
        const n = parseInt(document.getElementById("lp").value);
        document.getElementById("lorem-out").textContent = Array(n)
          .fill(loremBase)
          .join("\n\n");
      }

      function calcBMI() {
        const h = parseFloat(document.getElementById("bh").value) / 100;
        const w = parseFloat(document.getElementById("bw").value);
        if (!h || !w) {
          document.getElementById("bmi-out").textContent = "Sahi values daalo!";
          return;
        }
        const bmi = (w / (h * h)).toFixed(1);
        const cat =
          bmi < 18.5
            ? "Underweight ⚠️"
            : bmi < 25
              ? "Normal ✅"
              : bmi < 30
                ? "Overweight ⚠️"
                : "Obese ❌";
        document.getElementById("bmi-out").innerHTML =
          `<strong style="font-size:1.3rem">BMI: ${bmi}</strong><br><br>Category: ${cat}`;
      }

      function calcAge() {
        const v = document.getElementById("dob").value;
        const parts = v.split("/");
        if (parts.length !== 3) {
          document.getElementById("age-out").textContent =
            "Format galat hai! DD/MM/YYYY use karo";
          return;
        }
        const dob = new Date(parts[2], parts[1] - 1, parts[0]);
        const now = new Date();
        let y = now.getFullYear() - dob.getFullYear();
        let m = now.getMonth() - dob.getMonth();
        let d = now.getDate() - dob.getDate();
        if (d < 0) {
          m--;
          d += 30;
        }
        if (m < 0) {
          y--;
          m += 12;
        }
        document.getElementById("age-out").innerHTML =
          `<strong style="font-size:1.2rem">${y} saal, ${m} mahine, ${d} din</strong>`;
      }

      function b64(mode) {
        const v = document.getElementById("enc-in").value;
        try {
          document.getElementById("enc-out").textContent =
            mode === "encode"
              ? btoa(unescape(encodeURIComponent(v)))
              : decodeURIComponent(escape(atob(v)));
        } catch (e) {
          document.getElementById("enc-out").textContent =
            "Error: Invalid input for decoding";
        }
      }

      function copyText(id) {
        const el = document.getElementById(id);
        navigator.clipboard.writeText(el.textContent).then(() => {
          const orig = el.style.border;
          el.style.border = "1px solid #4ade80";
          setTimeout(() => (el.style.border = orig), 1200);
        });
      }

      genPass();
      genLorem();
    </script>
  </body>
</html>
