<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us - ToolsKart</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;
  --card:#13131a;
  --card2:#1a1a24;
  --border:#2a2a3a;
  --accent:#7c6aff;
  --accent2:#ff6a9b;
  --text:#f0f0ff;
  --muted:#888899;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);background:rgba(10,10,15,0.95);position:sticky;top:0;z-index:100}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.4rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
.nav-links a{color:var(--muted);text-decoration:none;font-size:0.9rem;margin-left:1.5rem}
.nav-links a:hover{color:var(--text)}
.container{max-width:600px;margin:0 auto;padding:3rem 2rem}
h1{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;margin-bottom:0.5rem}
h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{color:var(--muted);margin-bottom:2.5rem}
.form-group{margin-bottom:1.2rem}
label{display:block;color:var(--muted);font-size:0.9rem;margin-bottom:0.5rem}
input,textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0.9rem 1rem;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.95rem;outline:none;transition:border-color 0.2s}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:140px}
.btn{width:100%;padding:0.9rem;background:var(--accent);border:none;border-radius:10px;color:white;font-family:'Syne',sans-serif;font-weight:600;font-size:1rem;cursor:pointer;transition:opacity 0.2s;margin-top:0.5rem}
.btn:hover{opacity:0.85}
.info-cards{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:2.5rem}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem;text-align:center}
.info-icon{font-size:1.8rem;margin-bottom:0.5rem}
.info-title{font-family:'Syne',sans-serif;font-weight:600;font-size:0.95rem;margin-bottom:0.3rem}
.info-val{color:var(--muted);font-size:0.85rem}
.success{display:none;background:rgba(74,222,128,0.1);border:1px solid #4ade80;border-radius:10px;padding:1rem;text-align:center;color:#4ade80;margin-top:1rem}
footer{text-align:center;padding:2rem;color:var(--muted);font-size:0.85rem;border-top:1px solid var(--border);margin-top:3rem}
a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>

<nav class="nav">
  <a class="logo" href="/">ToolsKart</a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/privacy-policy.html">Privacy Policy</a>
  </div>
</nav>

<div class="container">
  <h1>Contact <span>Us</span></h1>
  <p class="subtitle">Koi sawaal hai? Hum yahan hain! Apna message bhejo.</p>

  <div>
    <div class="form-group">
      <label>Tumhara Naam</label>
      <input type="text" id="name" placeholder="e.g. Rahul Sharma">
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="text" id="email" placeholder="e.g. rahul@gmail.com">
    </div>
    <div class="form-group">
      <label>Subject</label>
      <input type="text" id="subject" placeholder="e.g. New tool suggestion">
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea id="message" placeholder="Apna message yahan likho..."></textarea>
    </div>
    <button class="btn" onclick="submitForm()">Send Message ✉️</button>
    <div class="success" id="success-msg">
      ✅ Message send ho gaya! Hum jald jawab denge.
    </div>
  </div>

  <div class="info-cards">
    <div class="info-card">
      <div class="info-icon">🌐</div>
      <div class="info-title">Website</div>
      <div class="info-val">vedant186upadhyay.github.io</div>
    </div>
    <div class="info-card">
      <div class="info-icon">⚡</div>
      <div class="info-title">Response Time</div>
      <div class="info-val">24-48 ghante</div>
    </div>
  </div>
</div>

<footer>
  &copy; 2026 ToolsKart. All rights reserved. |
  <a href="/">Home</a> |
  <a href="/privacy-policy.html">Privacy Policy</a>
</footer>

<script>
function submitForm(){
  const name=document.getElementById('name').value;
  const email=document.getElementById('email').value;
  const message=document.getElementById('message').value;
  if(!name||!email||!message){
    alert('Naam, email aur message fill karo!');
    return;
  }
  document.getElementById('success-msg').style.display='block';
  document.getElementById('name').value='';
  document.getElementById('email').value='';
  document.getElementById('subject').value='';
  document.getElementById('message').value='';
}
</script>

</body>
</html>
